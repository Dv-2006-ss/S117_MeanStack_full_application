<aside class="sidebar-container">
    <div class="sidebar-menu">
        <p class="section-title">CampaignAI</p>
        <a routerLink="/app/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
            <span class="material-symbols-outlined icon">dashboard</span>
            <span>Dashboard</span>
        </a>
        <a routerLink="/app/customers" routerLinkActive="active" class="nav-item">
            <span class="material-symbols-outlined icon">group</span>
            <span>Audience</span>
        </a>
        <a routerLink="/app/campaigns" routerLinkActive="active" class="nav-item">
            <span class="material-symbols-outlined icon">campaign</span>
            <span>Campaigns</span>
        </a>
        <a routerLink="/app/campaigns/new" routerLinkActive="active" class="nav-item">
            <span class="material-symbols-outlined icon">auto_awesome</span>
            <span>New Campaign</span>
        </a>

        <p class="section-title">Tools</p>
        <a routerLink="/app/templates" routerLinkActive="active" class="nav-item">
            <span class="material-symbols-outlined icon">auto_awesome_mosaic</span>
            <span>Template Studio</span>
        </a>
        <a routerLink="/email-builder" routerLinkActive="active" class="nav-item">
            <span class="material-symbols-outlined icon">mail</span>
            <span>Email Builder</span>
        </a>
        <a routerLink="/sms-builder" routerLinkActive="active" class="nav-item">
            <span class="material-symbols-outlined icon">sms</span>
            <span>SMS Builder</span>
        </a>
    </div>

    <div class="sidebar-footer">
        <a routerLink="/app/settings" class="nav-item mb-4">
            <span class="material-symbols-outlined icon">settings</span>
            <span>Settings</span>
        </a>
        <div class="plan-card">
            <p class="plan-name">Launch Workspace</p>
            <div class="progress-bar">
                <div class="fill"></div>
            </div>
            <p class="plan-usage">Email and SMS execution enabled</p>
        </div>
    </div>
</aside>
