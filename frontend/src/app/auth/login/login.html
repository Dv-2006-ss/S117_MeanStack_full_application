<div class="relative min-h-screen w-full flex items-center justify-center px-4 py-12 bg-gray-900">
  
  <!-- Video Background -->
  <div class="absolute inset-0 w-full h-full overflow-hidden">
    <div class="absolute inset-0 bg-black/50 z-10"></div>
    <video
      #videoBackground
      class="absolute inset-0 min-w-full min-h-full object-cover w-auto h-auto opacity-70"
      autoplay
      loop
      muted
      playsinline
    >
      <source src="https://videos.pexels.com/video-files/8128311/8128311-uhd_2560_1440_25fps.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
  </div>

  <!-- Login Form Container -->
  <div class="relative z-20 w-full max-w-md animate-in fade-in zoom-in duration-500">
    <div class="p-8 rounded-2xl backdrop-blur-md bg-black/60 border border-white/10 shadow-2xl">
      
      <!-- Logo Header -->
      <div class="mb-8 text-center">
        <h2 class="text-3xl font-bold mb-2 relative group inline-block">
          <span class="absolute -inset-2 bg-gradient-to-r from-purple-600/30 via-pink-500/30 to-blue-500/30 blur-2xl opacity-75 group-hover:opacity-100 transition-all duration-500 animate-pulse"></span>
          <span class="relative text-3xl font-bold mb-2 text-white tracking-widest uppercase" style="text-shadow: 0 0 20px rgba(255,255,255,0.4);">
            NexusGate
          </span>
          <span class="absolute -inset-0.5 bg-gradient-to-r from-purple-500/20 to-pink-500/20 blur-sm opacity-0 group-hover:opacity-100 transition-all duration-300"></span>
        </h2>
        <div class="text-white/80 flex flex-col items-center space-y-2 mt-4">
          <span class="relative group cursor-default">
            <span class="absolute -inset-1 bg-gradient-to-r from-purple-600/20 to-pink-600/20 blur-sm opacity-0 group-hover:opacity-100 transition-opacity duration-500"></span>
            <span class="relative inline-block tracking-wide font-light">Your gaming universe awaits</span>
          </span>
          <span class="text-xs text-white/50 animate-pulse font-mono mt-1">
            [Press Enter to join the adventure]
          </span>
          <div class="flex space-x-3 text-sm text-white/40 mt-3">
            <span class="animate-pulse">⚔️</span>
            <span class="animate-bounce" style="animation-delay: 200ms;">🎮</span>
            <span class="animate-pulse" style="animation-delay: 400ms;">🏆</span>
          </div>
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="message" class="mb-4 bg-red-500/20 border border-red-500/50 text-red-100 px-4 py-3 rounded text-sm text-center">
        {{ message }}
      </div>

      <!-- Form -->
      <form (submit)="login($event)" class="space-y-5">
        
        <!-- Email Input -->
        <div class="relative">
          <div class="absolute left-3 top-1/2 -translate-y-1/2 text-white/40">
            <lucide-icon [img]="MailIcon" class="w-5 h-5"></lucide-icon>
          </div>
          <input
            type="email"
            placeholder="Email address"
            name="email"
            [(ngModel)]="email"
            required
            class="w-full pl-11 pr-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/40 focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all duration-300"
          />
        </div>

        <!-- Password Input -->
        <div class="relative">
          <div class="absolute left-3 top-1/2 -translate-y-1/2 text-white/40">
            <lucide-icon [img]="LockIcon" class="w-5 h-5"></lucide-icon>
          </div>
          <input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Password"
            name="password"
            [(ngModel)]="password"
            required
            class="w-full pl-11 pr-12 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/40 focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all duration-300"
          />
          <button
            type="button"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-white/40 hover:text-white transition-colors focus:outline-none"
            (click)="togglePassword()"
          >
            <lucide-icon [img]="showPassword ? EyeOffIcon : EyeIcon" class="w-5 h-5"></lucide-icon>
          </button>
        </div>

        <!-- Options -->
        <div class="flex items-center justify-between mt-2">
          <div class="flex items-center space-x-3">
            <div (click)="remember = !remember" class="relative inline-block w-10 h-5 cursor-pointer">
              <input type="checkbox" class="sr-only" [checked]="remember" />
              <div 
                class="absolute inset-0 rounded-full transition-colors duration-300 ease-in-out"
                [ngClass]="remember ? 'bg-purple-600' : 'bg-white/20'"
              >
                <div 
                  class="absolute left-0.5 top-0.5 w-4 h-4 rounded-full bg-white transition-transform duration-300 ease-in-out shadow-sm"
                  [ngClass]="remember ? 'translate-x-5' : 'translate-x-0'"
                ></div>
              </div>
            </div>
            <label class="text-sm text-white/70 cursor-pointer hover:text-white transition-colors" (click)="remember = !remember">
              Remember me
            </label>
          </div>
          <a href="#" class="text-sm text-white/50 hover:text-white hover:underline transition-all">
            Forgot password?
          </a>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="loading || isSuccess"
          class="w-full py-3.5 rounded-xl text-white font-semibold flex items-center justify-center transition-all duration-300 mt-6"
          [ngClass]="isSuccess ? 'bg-green-500 shadow-[0_0_20px_rgba(34,197,94,0.4)] scale-105' : 'bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 disabled:opacity-70 disabled:cursor-not-allowed shadow-[0_0_15px_rgba(147,51,234,0.3)] hover:shadow-[0_0_25px_rgba(147,51,234,0.5)] active:scale-95'"
        >
          <span *ngIf="!loading && !isSuccess">Enter NexusGate</span>
          <span *ngIf="loading && !isSuccess" class="animate-pulse flex items-center">
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Linking...
          </span>
          <span *ngIf="isSuccess" class="flex items-center">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            Connection Established
          </span>
        </button>
      </form>

      <!-- Social Logins -->
      <div class="mt-10">
        <div class="relative flex items-center justify-center mb-6">
          <div class="border-t border-white/10 absolute w-full"></div>
          <div class="bg-[#0e0f17] px-4 relative text-white/40 text-xs tracking-widest uppercase">
            quick access via
          </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
          <button (click)="showGoogleToast()" class="flex items-center justify-center p-3.5 bg-white/5 border border-white/10 rounded-xl text-white/70 hover:bg-white/10 hover:border-white/20 hover:text-white hover:scale-105 transition-all duration-300">
            <lucide-icon [img]="ChromeIcon" class="w-5 h-5"></lucide-icon>
          </button>
          <button (click)="showGoogleToast()" class="flex items-center justify-center p-3.5 bg-white/5 border border-white/10 rounded-xl text-white/70 hover:bg-white/10 hover:border-white/20 hover:text-white hover:scale-105 transition-all duration-300">
            <lucide-icon [img]="TwitterIcon" class="w-5 h-5"></lucide-icon>
          </button>
          <button (click)="showGoogleToast()" class="flex items-center justify-center p-3.5 bg-white/5 border border-white/10 rounded-xl text-white/70 hover:bg-white/10 hover:border-white/20 hover:text-white hover:scale-105 transition-all duration-300 text-[#66c0f4]">
            <lucide-icon [img]="Gamepad2Icon" class="w-5 h-5"></lucide-icon>
          </button>
        </div>
      </div>

      <!-- Footer Setup -->
      <p class="mt-10 text-center text-sm text-white/50">
        Don't have an account?&nbsp;
        <a href="javascript:void(0)" (click)="goRegister($event)" class="font-medium text-white hover:text-purple-400 hover:underline transition-colors ml-1">
          Create Account
        </a>
      </p>
    </div>
  </div>

  <footer class="absolute bottom-6 left-0 right-0 text-center text-white/30 text-xs z-20 font-mono tracking-widest">
    © 2026 NEXUSGATE SERVER. ALL RIGHTS RESERVED.
  </footer>
</div>
